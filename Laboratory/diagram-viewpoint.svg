<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="左：先行研究の方法は部材Aと部材Bを先に別々の領域に分けるため、1つの視点が両方を同時にカバーする組み合わせを最初から見つけられない。右：本研究の方法は空間に候補点を密に散らし、各候補点が実際にどの対象点を見えるか個別に調べるため、部材Aと部材Bを同時にカバーする視点Xを見つけられる。">
  <rect x="0" y="0" width="700" height="320" fill="#ffffff" />

  <text x="170" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e2420">先行研究の方法（面を先に分割）</text>
  <text x="530" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b4f68">本研究の方法（空間から候補点を探す）</text>

  <!-- left: two members meeting at a corner -->
  <line x1="160" y1="220" x2="70" y2="100" stroke="#1e2420" stroke-opacity="0.32" stroke-width="16" stroke-linecap="round" />
  <line x1="160" y1="220" x2="160" y2="290" stroke="#1e2420" stroke-opacity="0.32" stroke-width="16" stroke-linecap="round" />
  <text x="45" y="92" font-family="sans-serif" font-size="12" fill="#1e2420" fill-opacity="0.75">部材A</text>
  <text x="168" y="298" font-family="sans-serif" font-size="12" fill="#1e2420" fill-opacity="0.75">部材B</text>

  <line x1="160" y1="220" x2="270" y2="150" stroke="#1e2420" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="225" y="140" font-family="sans-serif" font-size="10" fill="#1e2420" fill-opacity="0.6">領域の境界</text>

  <g fill="#1e2420" fill-opacity="0.8">
    <circle cx="137.5" cy="190" r="3.4" /><circle cx="115" cy="160" r="3.4" />
    <circle cx="92.5" cy="130" r="3.4" /><circle cx="79" cy="112" r="3.4" />
    <circle cx="160" cy="237.5" r="3.4" /><circle cx="160" cy="255" r="3.4" />
    <circle cx="160" cy="272.5" r="3.4" /><circle cx="160" cy="283" r="3.4" />
  </g>

  <line x1="60" y1="170" x2="137.5" y2="190" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="60" y1="170" x2="115" y2="160" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="60" y1="170" x2="92.5" y2="130" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="60" y1="170" x2="79" y2="112" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <circle cx="60" cy="170" r="6" fill="#1e2420" />
  <text x="30" y="190" font-family="sans-serif" font-size="11" fill="#1e2420">視点1</text>

  <line x1="235" y1="265" x2="160" y2="237.5" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="235" y1="265" x2="160" y2="255" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="235" y1="265" x2="160" y2="272.5" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <line x1="235" y1="265" x2="160" y2="283" stroke="#1e2420" stroke-width="1" stroke-opacity="0.55" />
  <circle cx="235" cy="265" r="6" fill="#1e2420" />
  <text x="240" y="283" font-family="sans-serif" font-size="11" fill="#1e2420">視点2</text>

  <text x="170" y="313" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#1e2420" fill-opacity="0.7">視点1は部材Aだけ、視点2は部材Bだけしか見ない</text>

  <line x1="345" y1="20" x2="345" y2="310" stroke="#1e2420" stroke-opacity="0.15" stroke-width="1" />

  <!-- right: same corner, space-sampled candidates -->
  <line x1="530" y1="220" x2="440" y2="100" stroke="#1e2420" stroke-opacity="0.32" stroke-width="16" stroke-linecap="round" />
  <line x1="530" y1="220" x2="530" y2="290" stroke="#1e2420" stroke-opacity="0.32" stroke-width="16" stroke-linecap="round" />
  <text x="405" y="92" font-family="sans-serif" font-size="12" fill="#1e2420" fill-opacity="0.75">部材A</text>
  <text x="538" y="298" font-family="sans-serif" font-size="12" fill="#1e2420" fill-opacity="0.75">部材B</text>

  <g fill="none" stroke="#1e2420" stroke-opacity="0.4">
    <circle cx="480" cy="170" r="3" /><circle cx="510" cy="130" r="3" />
    <circle cx="590" cy="200" r="3" /><circle cx="620" cy="170" r="3" />
    <circle cx="470" cy="240" r="3" /><circle cx="600" cy="250" r="3" />
    <circle cx="550" cy="110" r="3" /><circle cx="620" cy="230" r="3" />
    <circle cx="490" cy="275" r="3" />
  </g>
  <text x="605" y="120" font-family="sans-serif" font-size="10" fill="#1e2420" fill-opacity="0.55">候補点（未採用）</text>

  <g fill="#1e2420" fill-opacity="0.8">
    <circle cx="507.5" cy="190" r="3.4" /><circle cx="485" cy="160" r="3.4" />
    <circle cx="462.5" cy="130" r="3.4" /><circle cx="449" cy="112" r="3.4" />
    <circle cx="530" cy="237.5" r="3.4" /><circle cx="530" cy="255" r="3.4" />
    <circle cx="530" cy="272.5" r="3.4" /><circle cx="530" cy="283" r="3.4" />
  </g>

  <line x1="560" y1="170" x2="485" y2="160" stroke="#2b4f68" stroke-width="1.8" />
  <line x1="560" y1="170" x2="462.5" y2="130" stroke="#2b4f68" stroke-width="1.8" />
  <line x1="560" y1="170" x2="530" y2="237.5" stroke="#2b4f68" stroke-width="1.8" />
  <line x1="560" y1="170" x2="530" y2="255" stroke="#2b4f68" stroke-width="1.8" />
  <circle cx="560" cy="170" r="7" fill="#2b4f68" />
  <text x="567" y="166" font-family="sans-serif" font-size="12" font-weight="700" fill="#2b4f68">視点X</text>

  <text x="530" y="313" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#2b4f68" fill-opacity="0.9">視点Xは部材A・部材Bを同時に見る</text>
</svg>
